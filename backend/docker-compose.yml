      - "8002:8000"
    command: >
      sh -c "python manage.py migrate &&
      gunicorn seaweed_system.wsgi:application --bind 0.0.0.0:8000"

  inventory-service:
    build: .
    env_file: .env
    environment:
      SERVICE_NAME: inventory
      POSTGRES_DB: seaweed_inventory
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8000"
    command: >
      sh -c "python manage.py migrate &&
      gunicorn seaweed_system.wsgi:application --bind 0.0.0.0:8000"

  market-service:

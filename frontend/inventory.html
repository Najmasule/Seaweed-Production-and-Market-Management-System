<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seaweed MS — Inventory</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="app-content">
      <main class="page-content">
        <div class="page-header">
          <div><h1>Inventory</h1><p>Track current stock levels and manage inventory</p></div>
          <div class="page-header-actions">
            <button class="btn btn-primary" id="add-inventory-btn"><i class="fa-solid fa-plus"></i> Add Inventory</button>
          </div>
        </div>

        <!-- Low stock alert -->
        <div class="alert-strip hidden" id="low-stock-strip">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span><strong id="low-stock-count">0</strong> items are below reorder level and need restocking.</span>
        </div>

        <!-- Inventory stat cards -->
        <div class="stats-grid" id="inv-stats"></div>

        <div class="card">
          <div class="card-body" style="padding-bottom:0">
            <div class="filter-bar">
              <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="search-input" placeholder="Search inventory…" aria-label="Search inventory" /></div>
              <select class="filter-select" id="type-filter" aria-label="Filter by type"><option value="">All Types</option></select>
              <select class="filter-select" id="stock-filter" aria-label="Filter by stock level"><option value="">All Stock</option><option value="in">In Stock</option><option value="low">Low Stock</option><option value="out">Out of Stock</option></select>
              <button class="btn btn-ghost btn-sm" id="clear-filters"><i class="fa-solid fa-xmark"></i> Clear</button>
            </div>
          </div>
          <div class="table-wrapper" id="inventory-table"><div class="spinner-center"><span class="spinner spinner-lg"></span></div></div>
          <div class="pagination-wrapper" id="pagination"></div>
        </div>
      </main>
    </div>

    <!-- Add/Edit Inventory Modal -->
    <div class="modal-overlay" id="inventory-modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="inv-modal-title">
        <div class="modal-header"><h3 class="modal-title" id="inv-modal-title">Add Inventory</h3><button class="modal-close" data-close="inventory-modal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
        <form id="inventory-form"><div class="modal-body">
          <input type="hidden" id="inv-id" />
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="inv-name">Seaweed Type / Name <span class="req">*</span></label><input type="text" id="inv-name" required /></div>
            <div class="form-group"><label class="form-label" for="inv-quantity">Quantity (kg) <span class="req">*</span></label><input type="number" id="inv-quantity" step="0.1" min="0" required /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="inv-reorder">Reorder Level (kg)</label><input type="number" id="inv-reorder" step="0.1" min="0" value="10" /></div>
            <div class="form-group"><label class="form-label" for="inv-unit-price">Unit Price ($)</label><input type="number" id="inv-unit-price" step="0.01" min="0" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="inv-location">Storage Location</label><input type="text" id="inv-location" /></div>
            <div class="form-group"><label class="form-label" for="inv-batch">Batch Number</label><input type="text" id="inv-batch" /></div>
          </div>
          <div class="form-group"><label class="form-label" for="inv-notes">Notes</label><textarea id="inv-notes" rows="2"></textarea></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-ghost" data-close="inventory-modal">Cancel</button><button type="submit" class="btn btn-primary" id="inv-save-btn"><i class="fa-solid fa-save"></i> Save</button></div>
        </form>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/inventory.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seaweed MS — Market</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="app-content">
      <main class="page-content">
        <div class="page-header">
          <div><h1>Market</h1><p>Current market prices, trends, and sales overview</p></div>
          <div class="page-header-actions">
            <button class="btn btn-primary" id="add-price-btn"><i class="fa-solid fa-tag"></i> Add Market Price</button>
          </div>
        </div>

        <div class="stats-grid" id="market-stats"></div>

        <div class="tabs">
          <button class="tab active" data-tab="prices">Market Prices</button>
          <button class="tab" data-tab="trends">Market Trends</button>
          <button class="tab" data-tab="sales">Sales Overview</button>
        </div>

        <div class="tab-panel" id="tab-prices">
          <div class="card">
            <div class="card-body" style="padding-bottom:0">
              <div class="filter-bar">
                <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="search-input" placeholder="Search market prices…" aria-label="Search" /></div>
                <select class="filter-select" id="type-filter" aria-label="Filter by type"><option value="">All Types</option></select>
                <button class="btn btn-ghost btn-sm" id="clear-filters"><i class="fa-solid fa-xmark"></i> Clear</button>
              </div>
            </div>
            <div class="table-wrapper" id="market-table"><div class="spinner-center"><span class="spinner spinner-lg"></span></div></div>
            <div class="pagination-wrapper" id="pagination"></div>
          </div>
        </div>

        <div class="tab-panel hidden" id="tab-trends">
          <div class="charts-grid">
            <div class="chart-card full"><div class="chart-header"><div><h3>Price Trends</h3><p>Price changes over recent months</p></div></div><div class="chart-canvas-wrap tall"><canvas id="trend-chart"></canvas></div></div>
          </div>
        </div>

        <div class="tab-panel hidden" id="tab-sales">
          <div class="charts-grid">
            <div class="chart-card"><div class="chart-header"><div><h3>Monthly Sales Revenue</h3><p>Revenue over the last 12 months</p></div></div><div class="chart-canvas-wrap"><canvas id="sales-chart"></canvas></div></div>
            <div class="chart-card"><div class="chart-header"><div><h3>Sales by Type</h3><p>Revenue distribution</p></div></div><div class="chart-canvas-wrap"><canvas id="sales-type-chart"></canvas></div></div>
          </div>
          <div class="card mt-6"><div class="card-header"><h3 class="card-title">Recent Sales</h3></div><div class="table-wrapper" id="sales-table"></div></div>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="price-modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="price-modal-title">
        <div class="modal-header"><h3 class="modal-title" id="price-modal-title">Add Market Price</h3><button class="modal-close" data-close="price-modal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
        <form id="price-form"><div class="modal-body">
          <input type="hidden" id="price-id" />
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="price-type">Seaweed Type <span class="req">*</span></label><input type="text" id="price-type" required /></div>
            <div class="form-group"><label class="form-label" for="price-amount">Price per kg ($) <span class="req">*</span></label><input type="number" id="price-amount" step="0.01" min="0" required /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="price-date">Date <span class="req">*</span></label><input type="date" id="price-date" required /></div>
            <div class="form-group"><label class="form-label" for="price-market">Market Location</label><input type="text" id="price-market" /></div>
          </div>
          <div class="form-group"><label class="form-label" for="price-notes">Notes</label><textarea id="price-notes" rows="2"></textarea></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-ghost" data-close="price-modal">Cancel</button><button type="submit" class="btn btn-primary" id="price-save-btn"><i class="fa-solid fa-save"></i> Save</button></div>
        </form>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/market.js"></script>
  </body>
</html>
